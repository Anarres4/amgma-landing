head:
  number: "N° 001 · Première œuvre"
  # Le premier badge est rendu comme tag principal (stylisé en vert sage),
  # les suivants en badges secondaires.
  badges:
    - label: "● Live iOS"
      href: "https://apps.apple.com/fr/app/book-nova/id6752571289"
    - label: "● Live Android"
      href: "https://play.google.com/store/apps/details?id=com.quantumash.bigbangbook.app"

title_html: "Book <em>Nova.</em>"

lede: >-
  L'application qui transforme votre façon de lire. Scannez un livre,
  découvrez sa profondeur, construisez votre bibliothèque vivante
  et redonnez sa place à la lecture, une page à la fois.

features:
  - num: "01"
    label: "Scans illimités"
    desc: "Identifiez n'importe quel livre"
  - num: "02"
    label: "Recommandations éditoriales"
    desc: "Humaines, pas algorithmiques"
  - num: "03"
    label: "Statistiques de lecture"
    desc: "Votre carnet vivant"
  - num: "04"
    label: "Bibliothèque enrichie"
    desc: "Chaque livre, une histoire"

ctas:
  - label: "Visiter book-nova.com"
    href: "https://book-nova.com/"
    variant: primary
    arrow: true
    target: "_blank"
  - label: "Dossier presse"
    href: "/#contact"
    variant: ghost

# Vidéo de présentation jouée dans le mockup iPhone : muette, en boucle,
# lancée seulement quand la section arrive à l'écran
# (assets/js/product-video.js). Le navigateur prend la 1re source qu'il sait
# lire : AV1 (plus légère), sinon H.264.
# Format d'écran d'iPhone (720 × 1560, soit 9:19.5) : l'original en 9:16 est
# prolongé de 140 px en haut et en bas en étirant la couleur de ses bords
# (floutée), rien n'est rogné. « ?v=2 » force le rechargement de l'ancienne
# vidéo en 9:16.
video:
  label: "N° 001 · iOS / Android"
  poster: "/assets/video/book-nova-promo-poster.webp?v=2"
  title: "Vidéo de présentation de Book Nova"
  # Textes affichés dans la vidéo, dans l'ordre (alternative pour les
  # lecteurs d'écran, la vidéo étant muette) : à tenir à jour avec la vidéo.
  transcript: >-
    Combien de livres pour atteindre ta taille ? Chaque livre lu ajoute son
    épaisseur à ta pile, comparée à la taille des animaux. 55 livres : tu as
    lu ta taille ! Regarde ta pile grandir. Scanne le code-barres, c'est
    ajouté ; papier, e-book ou audio, tout compte. Des dizaines de badges à
    débloquer. Tes stats de lecture en un coup d'œil. Panne d'inspiration ?
    Lance le Livre Surprise. Pas de pression : juste le plaisir de lire, à
    ton rythme. Book Nova, regarde ta pile grandir. Gratuit sur iPhone et
    Android.
  sources:
    - src: "/assets/video/book-nova-promo-av1.mp4?v=2"
      type: 'video/mp4; codecs="av01.0.08M.08"'
    - src: "/assets/video/book-nova-promo-h264.mp4?v=2"
      type: 'video/mp4; codecs="avc1.640028"'
