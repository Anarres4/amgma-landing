{%- assign video = site.data.product.video -%}
<div class="phone-stage">
  <div class="phone-halo" aria-hidden="true"></div>
  <div class="phone">
    <div class="phone-screen">
      {%- comment -%} `controls` sert de repli sans JS : product-video.js le retire. {%- endcomment -%}
      <video class="phone-video" data-product-video muted loop playsinline controls preload="none"
             width="720" height="1280" poster="{{ video.poster | relative_url }}"
             aria-label="{{ video.title | escape }}" aria-describedby="product-video-transcript">
        {% for s in video.sources %}
          <source src="{{ s.src | relative_url }}" type='{{ s.type }}' />
        {% endfor %}
      </video>
      <span class="phone-island" aria-hidden="true"></span>
    </div>
    <button type="button" class="video-toggle" data-video-toggle hidden aria-label="Mettre la vidéo en pause">
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
  </div>
  <p class="visually-hidden" id="product-video-transcript">{{ video.transcript }}</p>
  <p class="phone-label" aria-hidden="true">{{ video.label }}</p>
</div>
