{%- comment -%}
  Lumière du jour du hero, affichée le jour seulement (voir « Lumière du
  jour » dans main.css) : l'ombre floue d'une fenêtre à croisillons et une
  tache de soleil de fin d'après-midi, mises en perspective par le CSS.
  Purement décoratif.
{%- endcomment -%}
<svg class="hero-daylight" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false">
  <defs>
    <filter id="daylight-penumbra" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="daylight-sun" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
    <radialGradient id="daylight-falloff" cx=".5" cy=".45" r=".52">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="daylight-mask"><rect width="1000" height="1000" fill="url(#daylight-falloff)"/></mask>
  </defs>
  <g mask="url(#daylight-mask)">
    <rect x="250" y="60" width="500" height="880" fill="#F4A24A" fill-opacity=".34" filter="url(#daylight-sun)"/>
    {%- comment -%} Opacité sur le groupe : les croisements ne foncent pas {%- endcomment %}
    <g fill="#39405A" opacity=".14" filter="url(#daylight-penumbra)">
      <rect x="488" y="20" width="24" height="960"/>
      <rect x="190" y="345" width="620" height="18"/>
      <rect x="190" y="640" width="620" height="18"/>
    </g>
  </g>
</svg>
